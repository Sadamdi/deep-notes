# Deep Notes: static frontend plus /api reverse proxy on the same origin.
# __SERVER_NAME__ is replaced by bootstrap-server.sh ("_" means "any host").
# TLS: after DNS points here, run certbot (see docs/DEPLOYMENT.md) which adds the 443 block.

server {
  listen 80;
  listen [::]:80;
  server_name __SERVER_NAME__;

  root /opt/deepnotes/app/frontend/dist;
  index index.html;

  # uploads can be large; the backend enforces the real per-file limit
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # single-page app: unknown paths fall back to index.html
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
